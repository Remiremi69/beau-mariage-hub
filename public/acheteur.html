<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Beau Mariage : votre assistant</title>
<style>
/* Remplace ces couleurs par celles du Beau Mariage. */
:root{
  --fond:#FFFDF9; --carte:#FFFFFF; --encre:#2A1A22; --doux:#6F5E66; --trait:#EADFD3;
  --accent:#6B1F3A; --sur-accent:#FFFFFF; --or:#A0650A; --bulle-moi:#6B1F3A; --texte-moi:#FFFFFF;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--fond);color:var(--encre);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px;border-bottom:1px solid var(--trait);display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--carte)}
header h1{margin:0;font-size:1.05rem;line-height:1.2}
header p{margin:2px 0 0;font-size:.82rem;color:var(--doux)}
.nouveau{border:1px solid var(--trait);background:none;color:var(--encre);border-radius:999px;padding:8px 14px;font:inherit;font-size:.85rem;cursor:pointer;white-space:nowrap}
main{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(88%,640px);padding:12px 14px;border-radius:18px;white-space:normal;overflow-wrap:anywhere}
.msg p{margin:0 0 .5em}.msg p:last-child{margin:0}
.msg ul{margin:.3em 0 .5em;padding-left:1.2em}
.agent{align-self:flex-start;background:var(--carte);border:1px solid var(--trait);border-bottom-left-radius:6px}
.moi{align-self:flex-end;background:var(--bulle-moi);color:var(--texte-moi);border-bottom-right-radius:6px}
.agent strong{color:var(--accent)}
.attente{align-self:flex-start;color:var(--doux);font-size:.9rem;padding:4px 6px}
.attente::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:pts 1.2s steps(4) infinite}
@keyframes pts{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.pistes{display:flex;flex-wrap:wrap;gap:8px}
.pistes button{border:1px dashed var(--or);background:none;color:var(--encre);border-radius:999px;padding:8px 12px;font:inherit;font-size:.88rem;cursor:pointer;text-align:left}
form{display:flex;gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--trait);background:var(--carte)}
textarea{flex:1;resize:none;font:inherit;padding:11px 14px;border:1px solid var(--trait);border-radius:20px;min-height:46px;max-height:140px;color:var(--encre);background:var(--fond)}
form button{border:0;background:var(--accent);color:var(--sur-accent);border-radius:999px;padding:0 18px;font:inherit;font-weight:700;cursor:pointer;min-height:46px}
form button:disabled{opacity:.5;cursor:default}
.mention{font-size:.75rem;color:var(--doux);text-align:center;padding:0 16px 8px;background:var(--carte)}
.mention a{color:inherit}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.attente::after{animation:none;content:"..."}}
</style>
</head>
<body>
<header>
  <div><h1>Le Beau Mariage</h1><p>Assistant IA : lieux et traiteurs, avec leurs prix</p></div>
  <button class="nouveau" id="nouveau" type="button">Nouvelle conversation</button>
</header>
<main id="fil" aria-live="polite"></main>
<form id="form">
  <label for="saisie" style="position:absolute;left:-9999px">Votre message</label>
  <textarea id="saisie" rows="1" placeholder="Date, nombre d'invités, coin du Beaujolais ou de Lyon…" maxlength="1500"></textarea>
  <button id="envoyer" type="submit">Envoyer</button>
</form>
<p class="mention">Assistant IA. Les prix sont des estimations à confirmer par les prestataires. Vos coordonnées ne sont transmises qu'aux prestataires que vous choisissez. <a href="https://lebeaumariage.fr/confidentialite">Confidentialité</a></p>
<script>
(function () {
  "use strict";
  var ACHETEUR_URL = "https://oanykcdjiolzawdjmmbv.supabase.co/functions/v1/acheteur";
  var CLE = "lbm-acheteur-v1";
  var ACCUEIL = "Bonjour ! Dites-moi votre date ou votre période, le nombre d'invités et le coin du Beaujolais ou de Lyon qui vous plaît. Je vous propose des **lieux** et des **traiteurs** avec leurs prix, et j'envoie les demandes de devis pour vous.";
  var PISTES = ["Un mariage en semaine en juin 2027 pour 80 personnes", "Un traiteur pour 120 invités près de Villefranche-sur-Saône", "Un lieu de réception pour 100 invités dans les Pierres Dorées"];
  var fil = document.getElementById("fil"), form = document.getElementById("form"), saisie = document.getElementById("saisie"), bouton = document.getElementById("envoyer");
  var etat = charger();

  function charger() {
    try { var e = JSON.parse(localStorage.getItem(CLE) || "null"); if (e && e.v === 1) return e; } catch (x) {}
    return { v: 1, items: [], state: null, sig: null };
  }
  function sauver() { try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (x) {} }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function rendu(texte) {
    var lignes = esc(texte).split(/\n/), html = "", liste = false;
    lignes.forEach(function (l) {
      var t = l.trim().replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
      if (/^[-•]\s+/.test(t)) { if (!liste) { html += "<ul>"; liste = true; } html += "<li>" + t.replace(/^[-•]\s+/, "") + "</li>"; return; }
      if (liste) { html += "</ul>"; liste = false; }
      if (t) html += "<p>" + t + "</p>";
    });
    return html + (liste ? "</ul>" : "");
  }
  function bulle(role, texte) {
    var d = document.createElement("div");
    d.className = "msg " + (role === "moi" ? "moi" : "agent");
    if (role === "moi") d.textContent = texte; else d.innerHTML = rendu(texte);
    fil.appendChild(d);
    fil.scrollTop = fil.scrollHeight;
  }
  function pistes() {
    var p = document.createElement("div");
    p.className = "pistes";
    PISTES.forEach(function (t) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = t;
      b.addEventListener("click", function () { p.remove(); envoyer(t); });
      p.appendChild(b);
    });
    fil.appendChild(p);
  }
  function afficher() {
    fil.innerHTML = "";
    bulle("agent", ACCUEIL);
    etat.items.forEach(function (m) { bulle(m.role, m.texte); });
    if (!etat.items.length) pistes();
  }
  function occupe(on) {
    bouton.disabled = on; saisie.disabled = on;
    var a = document.getElementById("attente");
    if (on && !a) { a = document.createElement("div"); a.id = "attente"; a.className = "attente"; a.textContent = "L'assistant cherche"; fil.appendChild(a); fil.scrollTop = fil.scrollHeight; }
    if (!on && a) a.remove();
  }
  function envoyer(texte) {
    texte = String(texte || "").trim();
    if (!texte) return;
    var pi = fil.querySelector(".pistes"); if (pi) pi.remove();
    etat.items.push({ role: "moi", texte: texte }); bulle("moi", texte); sauver();
    occupe(true);
    fetch(ACHETEUR_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: texte, state: etat.state, sig: etat.sig }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) {
        var j = x.j || {};
        var rep = j.reponse || j.erreur || "Je n'ai pas pu répondre. Réessayez dans un instant.";
        if (j.state && j.sig) { etat.state = j.state; etat.sig = j.sig; }
        etat.items.push({ role: "agent", texte: rep }); bulle("agent", rep); sauver();
      })
      .catch(function () { bulle("agent", "Connexion impossible. Vérifiez votre réseau et réessayez."); })
      .then(function () { occupe(false); saisie.focus(); });
  }
  form.addEventListener("submit", function (e) { e.preventDefault(); var t = saisie.value; saisie.value = ""; envoyer(t); });
  saisie.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event("submit")); } });
  saisie.addEventListener("input", function () { saisie.style.height = "auto"; saisie.style.height = Math.min(140, saisie.scrollHeight) + "px"; });
  document.getElementById("nouveau").addEventListener("click", function () { etat = { v: 1, items: [], state: null, sig: null }; sauver(); afficher(); saisie.focus(); });
  afficher();
})();
</script>
</body>
</html>
